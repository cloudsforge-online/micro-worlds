name: CI

# ────────────────────────────────────────────────────────────────────────────────────────────────
# The estate-wide half of this file is a CALL, not a copy. The 167 lines it replaces said so
# themselves: everything but "the three repository-specific rules at the bottom" was "a liability
# with a deletion date".
#
# WHAT THE COPY COST WHILE IT SURVIVED. service-ci.yml runs a step no bespoke file had: it derives
# every scope this service's route gates demand and fails if one is absent from the registry in
# @cloudsforge/contracts-auth. identity refuses to mint a token naming an unknown scope, so an
# unregistered scope is a service-to-service surface no identity-issued token can ever reach — and
# the suite stays green regardless, because it mints its own principals. This repository gates on
# four — worlds:read, worlds:write, worlds:admin and worlds:title — and nothing checked any of them.
#
# The shared workflow also brings this repository its first image job of any kind: the bespoke file
# had none, so nothing had ever established that this service's Dockerfile even builds, let alone
# that the image migrates, starts and answers /livez.
# ────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: worlds
      database-env-var: WORLDS_DATABASE_URL
      port: 4000
      # Match production rather than the workflow's default of 16: the estate's compose files pin
      # postgres:17-alpine, and a suite that passes on a version nobody runs proves nothing.
      postgres-version: '17'
      # The image smoke test boots the real service, and src/env.ts validates its configuration at
      # import — so the container needs the variables it declares, not just a database, or it exits
      # before it can serve /livez. CI-only NON-secrets: OUTBOX_SIGNING_SECRET only has to clear a
      # length check, and the upstream URLs are never dialled because /livez needs no upstream.
      # Never a real credential.
      #
      # THIS IS EXACTLY WHAT src/env.ts:232-241 DEMANDS AND NOTHING ELSE, which it was not.
      # `WORLDS_SERVICE_TOKEN` was set here too, and it is RETIRED: env.ts:245 reads it for one
      # purpose — to report it — and src/index.ts:113 logs `WORLDS_SERVICE_TOKEN is set and is
      # IGNORED` at ERROR. So every smoke run of this workflow printed a configuration error about
      # a variable this file was itself supplying. A placeholder rather than a secret, but a
      # deployment error in the logs of a job whose whole purpose is to prove the image boots
      # cleanly is a signal nobody can afford to learn to ignore.
      #
      # Its replacement, `WORLDS_IDENTITY_CREDENTIAL`, is deliberately NOT added: env.ts:180-183
      # says in as many words that it is optional so that this job can boot the image without one,
      # and `/readyz` — not `/livez` — is where its absence is enforced.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=ci-only-not-a-real-secret-000000000000
        LEDGER_URL=http://127.0.0.1:4007
        BILLING_URL=http://127.0.0.1:4009
    secrets:
      # @cloudsforge/* resolves through link:../runtime and link:../contracts rather than a
      # registry, so the workflow checks out micro-runtime and micro-contracts as siblings. Both are
      # private, so it needs a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  controls:
    name: The controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Rule 7 — migrations are never run by the service process'
        run: |
          if grep -nE '\bmigrate\(' src/index.ts; then
            echo '::error::index.ts calls migrate — that is the migrator job, not the service'
            exit 1
          fi
          echo 'ok: the service process does not migrate'

      - name: 'Rule 8 — every background timer is a leased job'
        # The shared workflow bans setInterval. This repository bans setTimeout with it.
        # Comment lines are excluded: this repository DISCUSSES the frozen service's timers, and a
        # check that cannot tell a timer from a sentence about one is a check people learn to
        # ignore.
        run: |
          if grep -rnE '\bset(Interval|Timeout)\(' src/ --include='*.ts' \
             | grep -v '\.test\.ts' \
             | grep -vE '^[^:]+:[0-9]+: *(//|\*)'; then
            echo '::error::a timer was found; background work is a leased job (@cloudsforge/jobs)'
            exit 1
          fi
          echo 'ok: no unmarked timer'

      # The two controls this service exists to add, asserted as text so they cannot be deleted in
      # a refactor without a red build. The tests prove they WORK; these prove they are still THERE.
      - name: 'The bound constraint and the season budget cap still exist'
        run: |
          grep -q 'inventory_items_bound_not_listed' src/migrations.ts \
            || { echo '::error::the bound constraint is gone; a power item could be listed for sale'; exit 1; }
          grep -q 'seasons_within_budget' src/migrations.ts \
            || { echo '::error::the season budget cap is gone; a reward exploit would be unbounded'; exit 1; }

      - name: 'The entitlement webhook still verifies a signature'
        run: |
          grep -q 'timingSafeEqual' src/server.ts \
            || { echo '::error::the event signature check is gone; POST /v1/events is a free-worlds endpoint'; exit 1; }

      # A `*/` in the MIDDLE of a block comment terminates it early and silently uncomments
      # whatever follows. The pattern matches a continuation line of a block comment (leading `*`)
      # that carries a `*/` with more text after it — which is the only shape that does damage.
      # A single-line `/** … */` is fine and is not matched.
      - name: 'No comment-terminating sequence inside a block comment'
        run: |
          if grep -rnE '^\s*\*.*\*/.+' src/ --include='*.ts'; then
            echo '::error::a */ appears mid-way through a block comment and terminates it early'
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts:889-934, image name derived
  # at tools/registry.ts:367-369); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts:937-975); and deploy/scripts/release-deploy.sh:99-125 refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [estate, controls]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
